<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Play Farm — MyFarmTwin</title>
 <meta name="description" content="Plant, care, harvest and build your own little farm. A free farm life game in English and Bahasa Indonesia.">
 <link rel="canonical" href="https://myfarmtwin.com/play/">
 <meta property="og:title" content="Play Farm — MyFarmTwin"><meta property="og:description" content="A little land. A lot to grow. Plant your first seed and build a thriving farm."><meta property="og:type" content="website"><meta property="og:url" content="https://myfarmtwin.com/play/">
 <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="./style.css">
 <script type="module" src="./main.js"></script>
</head>
<body>
 <a class="skip-link" href="#farm">Skip to farm</a>
 <header class="game-header">
  <a class="brand" href="/" aria-label="MyFarmTwin home"><span class="brand-leaf" aria-hidden="true">✦</span>My<span>Farm</span>Twin</a>
  <span class="edition" data-i18n="edition">THE LITTLE FARM</span>
  <div class="header-actions"><a href="/" data-i18n="journal">Back to journal</a><label class="language-label"><span class="sr-only">Language / Bahasa</span><select id="language" aria-label="Language / Bahasa"><option value="en">EN</option><option value="id">ID</option></select></label></div>
 </header>
 <main id="farm" tabindex="-1">
  <section class="welcome"><p class="eyebrow" data-i18n="eyebrow">GROW SOMETHING GOOD</p><h1 data-i18n="title">A little land. A lot to grow.</h1><p data-i18n="intro">Your own small corner of the world. Start with a seed.</p></section>
  <section id="world" class="world" aria-label="Your farm"><p class="world-placeholder" data-i18n="ready">Welcome to your little farm.</p></section>
  <section id="plot-panel" class="plot-panel" aria-labelledby="plot-heading" hidden>
   <div><p class="eyebrow" data-i18n="selectedBed">YOUR GROWING SPACE</p><h2 id="plot-heading">Plot 1</h2><p id="plot-status"></p></div>
   <div id="plot-actions" class="plot-actions"></div>
   <button id="close-plot" class="close-panel" type="button" data-i18n="close">Close</button>
  </section>
  <p class="local-note" data-i18n="local">No account. Just you, a little land, and a fresh start.</p>
 </main>
 <div id="notice" class="notice" role="status" aria-live="polite"></div>
 <noscript>This farm needs JavaScript. You can still <a href="/">explore the journal</a>.</noscript>
</body></html>
